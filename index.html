<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Novela Visual</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:black;
overflow:hidden;
}

#game{

position:relative;

width:100vw;
height:100vh;

background:url("img/fondo.png") center center;
background-size:cover;

}

/* PERSONAJE */

#personaje{

position:absolute;

bottom:18vh;

left:50%;

transform:translateX(-50%);

height:72vh;

max-height:900px;

pointer-events:none;

transition:.35s;

}

/* GLOBO */

#dialogo{

position:absolute;

left:2%;
right:2%;

bottom:2%;

background:white;

border:5px solid black;

border-radius:18px;

padding:20px;

box-shadow:0 0 20px rgba(0,0,0,.4);

}

#name{

font-weight:bold;

font-size:24px;

color:#2359d6;

margin-bottom:10px;

}

#text{

font-size:22px;

line-height:1.4;

min-height:70px;

}

#continuar{

text-align:right;

margin-top:12px;

font-size:16px;

color:gray;

animation:parpadeo 1s infinite;

}

@keyframes parpadeo{

50%{
opacity:.2;
}

}

/* CELULAR */

@media(max-width:700px){

#personaje{
height:63vh;
}

#name{
font-size:20px;
}

#text{
font-size:18px;
}

}

</style>

</head>

<body>

<div id="game">

<audio id="musica" loop>
    <source src="Audio/Gogogo.mp3" type="audio/mpeg">
</audio>

<img
id="personaje"
src="img/personaje-feliz.png"
>

<div id="dialogo">

<div id="name"></div>

<div id="text"></div>

<div id="continuar">

▼ Toca la pantalla

</div>

</div>

</div>

<script>

const escenas=[

{

nombre:"Tú",

imagen:"img/personaje-feliz.png",

texto:"¡Holiiii! ¡Holi crayoli! ¿Cómo estás mi niña?"

},

{

nombre:"Tú",

imagen:"img/personaje-triste.png",

texto:"Hoy fue un día muy ocupado, me la pasé limpiando el cuarto con mi hermano, levantando la cama y muchos quehaceres..."

},

{

nombre:"Tú",

imagen:"img/personaje-perdon.png",

texto:"Perdona si he estado muy inactivo contigo este día, después de que terminamos, nos pusimos a ver una película, y apenas me he acordado del cel."

},

{

nombre:"Tú",

imagen:"img/personaje-ilusionado.png",

texto:"Pero hoy me dieron ganas de hacer algo diferente para iniciar la conversación."

},

{

nombre:"Tú",

imagen:"img/personaje-feliz.png",

texto:"Se me ocurrió la idea de hacer esto como una novela visual jejejeje xD"

},

{

nombre:"Tú",

imagen:"img/personaje-ilusionado.png",

texto:"Hasta me volví anime amooooooor XDXDXD"

},

{

nombre:"Tú",

imagen:"img/personaje-feliz.png",

texto:"En fin, quiero que sepas que espero y te haya ido muy bien en el trabajo el día de hoy y que ya estoy disponible para ti ❤️"

},

{

nombre:"Tú",

imagen:"img/personaje-feliz.png",

texto:"FIN ❤️"

}

];

let indice=0;

const personaje=document.getElementById("personaje");
const nombre=document.getElementById("name");
const texto=document.getElementById("text");
const musica=document.getElementById("musica");

musica.volume=0.25;

function mostrar(){

personaje.src=escenas[indice].imagen;
nombre.textContent=escenas[indice].nombre;
texto.textContent=escenas[indice].texto;

}

mostrar();

// Intenta reproducir automáticamente
musica.play().catch(()=>{

// En celulares normalmente se bloqueará hasta el primer toque.

});

document.getElementById("game").addEventListener("click",()=>{

// Si la música aún no ha comenzado, iniciar al primer toque
if(musica.paused){
    musica.play();
}

indice++;

if(indice>=escenas.length){

indice=0;

}

mostrar();

});

</script>

</body>

</html>
